<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Zero-trust: mTLS client SVID plus Cedar authorization; only the payments SVID with POST is permitted">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2140"/><stop offset="1" stop-color="#071426"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="-10%" r="95%"><stop offset="0" stop-color="#164a77" stop-opacity="0.55"/><stop offset="1" stop-color="#164a77" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12325a"/><stop offset="1" stop-color="#0e2647"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#124a4a"/><stop offset="1" stop-color="#0d3138"/></linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#02060c" flood-opacity="0.55"/></filter>
    <filter id="tealGlow" x="-70%" y="-90%" width="240%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2dd4bf" flood-opacity="0.55"/></filter>
    <marker id="aGreen" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>

  <rect width="900" height="440" fill="url(#bg)"/>
  <rect width="900" height="440" fill="url(#halo)"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#e8eef7">
    <circle cx="52" cy="52" r="6" fill="#2dd4bf"/>
    <text x="70" y="50" font-size="23" font-weight="700">Zero-trust — mTLS + Cedar</text>
    <text x="70" y="74" font-size="14" fill="#9fb2cc">Every request proves a client SPIFFE identity; an in-process Cedar policy authorizes it. Deny by default.</text>

    <!-- component label above the proxy -->
    <text x="458" y="138" text-anchor="middle" font-size="14" font-weight="700">ZenoIngress proxy</text>
    <text x="458" y="157" text-anchor="middle" font-size="11.5" fill="#7fe6d8">TLS terminate · Cedar authz (PDP)</text>

    <!-- Proxy node (padlock only) -->
    <g transform="translate(360,168)">
      <rect width="196" height="150" rx="16" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <path d="M84,66 a14,14 0 0 1 28,0 v14" fill="none" stroke="#2dd4bf" stroke-width="2.6"/>
      <rect x="78" y="78" width="40" height="34" rx="6" fill="#0d3138" stroke="#2dd4bf" stroke-width="2.2"/>
      <circle cx="98" cy="93" r="4" fill="#2dd4bf"/><line x1="98" y1="93" x2="98" y2="101" stroke="#2dd4bf" stroke-width="2.4"/>
    </g>

    <!-- api backend -->
    <g transform="translate(724,152)">
      <rect width="140" height="66" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="44" y="14" width="52" height="10" rx="2.5" fill="none" stroke="#9fb2cc" stroke-width="1.5"/>
      <rect x="44" y="27" width="52" height="10" rx="2.5" fill="none" stroke="#9fb2cc" stroke-width="1.5"/>
      <text x="70" y="57" text-anchor="middle" font-size="14" font-weight="600">api</text>
    </g>

    <!-- Lane A: payments SVID POST -> 200 -->
    <text x="40" y="173" font-size="12.5" fill="#34d399" font-weight="600">payments SVID · POST</text>
    <line x1="40" y1="185" x2="358" y2="185" stroke="#34d399" stroke-width="2.6" marker-end="url(#aGreen)"/>
    <line x1="558" y1="185" x2="722" y2="185" stroke="#34d399" stroke-width="2.6" marker-end="url(#aGreen)"/>
    <text x="640" y="176" text-anchor="middle" font-size="12.5" fill="#34d399" font-weight="700">200 ✓</text>

    <!-- Lane B: analytics SVID -> 403 -->
    <text x="40" y="245" font-size="12.5" fill="#f0a0a0" font-weight="600">analytics SVID</text>
    <line x1="40" y1="258" x2="342" y2="258" stroke="#f87171" stroke-width="2.4" stroke-dasharray="7 5"/>
    <g stroke="#f87171" stroke-width="3" stroke-linecap="round"><line x1="346" y1="251" x2="360" y2="265"/><line x1="360" y1="251" x2="346" y2="265"/></g>
    <text x="150" y="280" font-size="12.5" fill="#f87171" font-weight="700">403 · not in the payments group</text>

    <!-- Lane C: no cert -> handshake refused (before proxy) -->
    <text x="40" y="322" font-size="12.5" fill="#f0a0a0" font-weight="600">no client cert</text>
    <line x1="40" y1="335" x2="296" y2="335" stroke="#f87171" stroke-width="2.4" stroke-dasharray="7 5"/>
    <g stroke="#f87171" stroke-width="3" stroke-linecap="round"><line x1="300" y1="328" x2="314" y2="342"/><line x1="314" y1="328" x2="300" y2="342"/></g>
    <text x="120" y="357" font-size="12.5" fill="#f87171" font-weight="700">TLS handshake refused</text>

    <text x="450" y="415" text-anchor="middle" font-size="13" fill="#9fb2cc">The verified SPIFFE identity — not a network position — is the perimeter.</text>
  </g>
</svg>
