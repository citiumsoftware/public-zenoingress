# Zero-trust gateway demo. A network position buys nothing: every request must
# present a valid client SPIFFE SVID (mTLS), and a Cedar policy authorizes on the
# SVID identity — deny-by-default, evaluated in-process (no sidecar, no PDP).
#
#   mTLS (client SVID) ─▶ ZenoIngress proxy ─▶ [Cedar AuthzPolicy] ─▶ api
#         │                     │                      │
#    GEP-91 frontendValidation  │            x-spiffe-id (from the cert) = principal
#    (no cert → handshake fail) TLS terminate         permit payments+POST only
#
# The server cert / client-CA secrets are created by up.sh from gen-certs.sh.
---
apiVersion: v1
kind: Namespace
metadata:
  name: zero-trust
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-caddyfile
  namespace: zero-trust
data:
  Caddyfile: |
    :80 {
      respond "payments-api: authorized ✔" 200
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zero-trust
  labels: { app: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: cfg, mountPath: /etc/caddy }]
      volumes:
        - name: cfg
          configMap: { name: api-caddyfile }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: zero-trust
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zt-gateway
  namespace: zero-trust
spec:
  gatewayClassName: zenoingress
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: zt.demo.zeno
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: zt-server-cert
        # GEP-91: require a client cert chaining to this CA (mode defaults to
        # AllowValidOnly, so no cert / bad cert → the TLS handshake is rejected).
        # The experimental CRD requires an explicit (empty = core) group.
        frontendValidation:
          caCertificateRefs:
            - group: ""
              kind: Secret
              name: zt-client-ca
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zt-api
  namespace: zero-trust
spec:
  parentRefs:
    - name: zt-gateway
  hostnames:
    - zt.demo.zeno
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: zenoingress.io
            kind: AuthzPolicy
            name: zt-authz
      backendRefs:
        - name: api
          port: 80
---
apiVersion: zenoingress.io/v1alpha1
kind: AuthzPolicy
metadata:
  name: zt-authz
  namespace: zero-trust
spec:
  # The proxy sets x-spiffe-id from the verified client cert's URI SAN (and
  # strips any inbound value), so this header is the cryptographic identity.
  principalHeader: x-spiffe-id
  principalType: Workload
  resourceType: Endpoint
  onError: deny            # fail-closed: an un-evaluable policy denies
  # Only the payments workload may POST to /api/payments. Everything else — a
  # different SVID, a different method, a different path — has no permit and is
  # denied by default.
  policies: |
    permit(
      principal in Group::"payments",
      action == Action::"POST",
      resource
    )
    when { context.path like "/api/payments*" };
  # Group membership: bind the payments SVID into Group::"payments". The
  # analytics SVID is intentionally absent, so it never matches the permit.
  entities: |
    [
      {
        "uid": { "type": "Workload", "id": "spiffe://demo.zeno/payments" },
        "attrs": {},
        "parents": [ { "type": "Group", "id": "payments" } ]
      },
      {
        "uid": { "type": "Group", "id": "payments" },
        "attrs": {},
        "parents": []
      }
    ]
