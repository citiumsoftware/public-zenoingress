# Standard-mode ZenoIngress, plus an init container that fetches the Coraza
# proxy-wasm module into a shared volume the proxy mounts read-only at /waf.
# The WafPolicy in k8s/manifests.yaml loads the full OWASP CRS from it.
#
# Same as the waf-app showcase, but with more proxy memory: the CRS compiles
# ~900 rules per pooled wasm instance.
controller:
  replicaCount: 1

proxy:
  replicaCount: 1
  service:
    type: ClusterIP        # kind has no LoadBalancer; verify.sh port-forwards
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi          # headroom for CRS rule compilation
    requests:
      cpu: 100m
      memory: 128Mi

  # Pull the Coraza WAF module into an emptyDir before the proxy starts.
  initContainers:
    - name: fetch-coraza-waf
      image: alpine:3.21
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          cd /tmp
          echo "fetching coraza-proxy-wasm 0.6.0 ..."
          wget -qO coraza.zip https://github.com/corazawaf/coraza-proxy-wasm/releases/download/0.6.0/coraza-proxy-wasm-0.6.0.zip
          unzip -o coraza.zip >/dev/null
          cp "$(find . -name '*.wasm' | head -1)" /waf/coraza.wasm
          echo "installed:" && ls -l /waf/coraza.wasm
      volumeMounts:
        - name: waf-module
          mountPath: /waf

  extraVolumes:
    - name: waf-module
      emptyDir: {}

  extraVolumeMounts:
    - name: waf-module
      mountPath: /waf
      readOnly: true
