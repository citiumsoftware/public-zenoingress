<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Basic HTTP routing: client to Gateway to HTTPRoute to Service">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2140"/><stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="-10%" r="95%">
      <stop offset="0" stop-color="#164a77" stop-opacity="0.55"/><stop offset="1" stop-color="#164a77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12325a"/><stop offset="1" stop-color="#0e2647"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#124a4a"/><stop offset="1" stop-color="#0d3138"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#02060c" flood-opacity="0.55"/>
    </filter>
    <filter id="tealGlow" x="-70%" y="-90%" width="240%" height="280%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2dd4bf" flood-opacity="0.5"/>
    </filter>
    <marker id="aTeal" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  </defs>

  <rect width="900" height="400" fill="url(#bg)"/>
  <rect width="900" height="400" fill="url(#halo)"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#e8eef7">
    <!-- title -->
    <circle cx="52" cy="52" r="6" fill="#2dd4bf"/>
    <text x="70" y="50" font-size="23" font-weight="700">Basic HTTP routing</text>
    <text x="70" y="74" font-size="14" fill="#9fb2cc">Expose a Service with a Gateway and an HTTPRoute — the Gateway API essentials.</text>

    <!-- arrows -->
    <g stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#aTeal)">
      <line x1="182" y1="212" x2="264" y2="212"/>
      <line x1="409" y1="212" x2="491" y2="212"/>
      <line x1="636" y1="212" x2="718" y2="212"/>
    </g>

    <!-- Client -->
    <g transform="translate(44,178)">
      <rect width="138" height="70" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="24" y="18" width="90" height="30" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.6"/>
      <circle cx="34" cy="25" r="2" fill="#9fb2cc"/><circle cx="42" cy="25" r="2" fill="#9fb2cc"/>
      <text x="69" y="60" text-anchor="middle" font-size="14.5" font-weight="600">Client</text>
    </g>

    <!-- Gateway (zenoingress) -->
    <g transform="translate(271,178)">
      <rect width="138" height="70" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.55" filter="url(#tealGlow)"/>
      <text x="69" y="30" text-anchor="middle" font-size="14.5" font-weight="700">Gateway</text>
      <text x="69" y="50" text-anchor="middle" font-size="11" fill="#7fe6d8">class: zenoingress</text>
    </g>

    <!-- HTTPRoute -->
    <g transform="translate(498,178)">
      <rect width="138" height="70" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.55" filter="url(#tealGlow)"/>
      <text x="69" y="30" text-anchor="middle" font-size="14.5" font-weight="700">HTTPRoute</text>
      <text x="69" y="50" text-anchor="middle" font-size="11" fill="#7fe6d8">hello.example.com</text>
    </g>

    <!-- Service -->
    <g transform="translate(725,178)">
      <rect width="138" height="70" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="46" y="14" width="46" height="10" rx="2.5" fill="none" stroke="#9fb2cc" stroke-width="1.5"/>
      <rect x="46" y="27" width="46" height="10" rx="2.5" fill="none" stroke="#9fb2cc" stroke-width="1.5"/>
      <text x="69" y="60" text-anchor="middle" font-size="14.5" font-weight="600">Service</text>
    </g>

    <!-- caption -->
    <text x="450" y="330" text-anchor="middle" font-size="13.5" fill="#9fb2cc">The controller programs the data plane from your Gateway + HTTPRoute; traffic flows to the backend Pods.</text>
  </g>
</svg>
