<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Basic ingress: client to ZenoIngress proxy to Caddy app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2140"/><stop offset="1" stop-color="#071426"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="-10%" r="95%"><stop offset="0" stop-color="#164a77" stop-opacity="0.55"/><stop offset="1" stop-color="#164a77" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12325a"/><stop offset="1" stop-color="#0e2647"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#124a4a"/><stop offset="1" stop-color="#0d3138"/></linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#02060c" flood-opacity="0.55"/></filter>
    <filter id="tealGlow" x="-70%" y="-90%" width="240%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2dd4bf" flood-opacity="0.5"/></filter>
    <marker id="aTeal" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
  </defs>

  <rect width="900" height="400" fill="url(#bg)"/>
  <rect width="900" height="400" fill="url(#halo)"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#e8eef7">
    <circle cx="52" cy="52" r="6" fill="#2dd4bf"/>
    <text x="70" y="50" font-size="23" font-weight="700">Basic ingress</text>
    <text x="70" y="74" font-size="14" fill="#9fb2cc">One command: a local cluster, the public chart, and a Caddy app behind the proxy.</text>

    <!-- config chip feeding the proxy -->
    <g transform="translate(363,108)">
      <rect width="174" height="34" rx="9" fill="#0e2647" stroke="#26456b"/>
      <text x="87" y="22" text-anchor="middle" font-size="12" fill="#9fb2cc">Gateway + HTTPRoute</text>
    </g>
    <line x1="450" y1="142" x2="450" y2="168" stroke="#3a5c82" stroke-width="1.6" stroke-dasharray="3 3"/>

    <!-- arrows -->
    <g stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#aTeal)">
      <line x1="188" y1="206" x2="353" y2="206"/>
      <line x1="547" y1="206" x2="703" y2="206"/>
    </g>

    <!-- Client -->
    <g transform="translate(50,170)">
      <rect width="138" height="72" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="24" y="18" width="90" height="30" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.6"/>
      <circle cx="34" cy="25" r="2" fill="#9fb2cc"/><circle cx="42" cy="25" r="2" fill="#9fb2cc"/>
      <text x="69" y="62" text-anchor="middle" font-size="14.5" font-weight="600">Client</text>
    </g>

    <!-- ZenoIngress proxy -->
    <g transform="translate(355,170)">
      <rect width="190" height="72" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <path d="M30,22 L43,29 L43,42 L30,49 L17,42 L17,29 Z" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
      <text x="58" y="32" font-size="14.5" font-weight="700">ZenoIngress</text>
      <text x="58" y="51" font-size="11.5" fill="#7fe6d8">proxy · standard mode</text>
    </g>

    <!-- Caddy -->
    <g transform="translate(705,170)">
      <rect width="150" height="72" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="50" y="14" width="50" height="34" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.5"/>
      <line x1="50" y1="23" x2="100" y2="23" stroke="#9fb2cc" stroke-width="1.5"/>
      <text x="75" y="62" text-anchor="middle" font-size="14.5" font-weight="600">Caddy app</text>
    </g>

    <text x="450" y="330" text-anchor="middle" font-size="13.5" fill="#9fb2cc">Serves <tspan fill="#2dd4bf">welcome.zenoingress.test</tspan> — no tunnel, no edges, just the ingress path.</text>
  </g>
</svg>
