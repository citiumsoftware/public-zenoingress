# CORS for a browser-facing API, handled by the gateway (HTTPRoute CORS filter).
#
#   browser on https://app.example.test ──fetch()──▶ api.example.test
#
# The proxy answers CORS preflights itself (the API never sees them, and they
# work even where the API requires authentication), and adds the CORS headers to
# the API's responses for allowed origins only.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cors
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api
  namespace: cors
data:
  Caddyfile: |
    :80 {
      header Content-Type application/json
      respond `{"orders": 3}` 200
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cors
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: cfg, mountPath: /etc/caddy }]
      volumes:
        - name: cfg
          configMap: { name: api }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cors
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
  namespace: cors
spec:
  gatewayClassName: zenoingress
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: cors
spec:
  parentRefs:
    - name: gw
  hostnames: [api.example.test]
  rules:
    - filters:
        - type: CORS
          cors:
            # The web app's own origin, and any of its preview deployments.
            allowOrigins:
              - https://app.example.test
              - https://*.preview.example.test
            allowMethods: [GET, POST, DELETE]
            allowHeaders: [authorization, content-type]
            exposeHeaders: [x-request-id]
            allowCredentials: true
            maxAge: 600
      backendRefs:
        - name: api
          port: 80
