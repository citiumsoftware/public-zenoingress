# A Gateway per team: each gets its OWN proxy Deployment and Service (so its own
# address), in its own namespace, owned by the Gateway. Both teams use the same
# hostname, shop.example.test: they are isolated because they have separate
# data planes, not because one namespace wins.
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-red
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: team-red
data:
  Caddyfile: |
    :80 {
      respond "red shop" 200
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: team-red
spec:
  replicas: 1
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: cfg, mountPath: /etc/caddy }]
      volumes:
        - name: cfg
          configMap: { name: app }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: team-red
spec:
  selector: { app: app }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: team-red
spec:
  gatewayClassName: zenoingress
  # Copied onto the Gateway's proxy Deployment, Service and pods (GEP-1762).
  infrastructure:
    labels:
      cost-center: team-red
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: shop.example.test
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: team-red
spec:
  parentRefs:
    - name: web
  rules:
    - backendRefs:
        - name: app
          port: 80
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-blue
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app
  namespace: team-blue
data:
  Caddyfile: |
    :80 {
      respond "blue shop" 200
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: team-blue
spec:
  replicas: 1
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: cfg, mountPath: /etc/caddy }]
      volumes:
        - name: cfg
          configMap: { name: app }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: team-blue
spec:
  selector: { app: app }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: team-blue
spec:
  gatewayClassName: zenoingress
  # Copied onto the Gateway's proxy Deployment, Service and pods (GEP-1762).
  infrastructure:
    labels:
      cost-center: team-blue
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: shop.example.test
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: team-blue
spec:
  parentRefs:
    - name: web
  rules:
    - backendRefs:
        - name: app
          port: 80
