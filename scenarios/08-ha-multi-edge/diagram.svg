<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="HA / multi-edge: two public edges front one sovereign cluster; a single edge failure does not take the app down">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2140"/><stop offset="1" stop-color="#071426"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="-10%" r="95%"><stop offset="0" stop-color="#164a77" stop-opacity="0.55"/><stop offset="1" stop-color="#164a77" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12325a"/><stop offset="1" stop-color="#0e2647"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#124a4a"/><stop offset="1" stop-color="#0d3138"/></linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#02060c" flood-opacity="0.55"/></filter>
    <filter id="tealGlow" x="-70%" y="-90%" width="240%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2dd4bf" flood-opacity="0.5"/></filter>
    <marker id="aTeal" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>

  <rect width="900" height="470" fill="url(#bg)"/>
  <rect width="900" height="470" fill="url(#halo)"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#e8eef7">
    <circle cx="52" cy="52" r="6" fill="#2dd4bf"/>
    <text x="70" y="50" font-size="23" font-weight="700">HA / multi-edge — two front doors, one cluster</text>
    <text x="70" y="74" font-size="14" fill="#9fb2cc">One hostname on two edges. Either edge serves; a single edge failure doesn't take the app down.</text>

    <!-- sovereign cluster boundary -->
    <rect x="504" y="116" width="368" height="330" rx="18" fill="#0a2038" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="524" y="146" font-size="14" font-weight="700">Sovereign cluster</text>
    <text x="524" y="165" font-size="12" fill="#f0b45f">no inbound ports · egress-only</text>

    <!-- Client -->
    <g transform="translate(40,206)">
      <rect width="128" height="80" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="22" y="20" width="84" height="30" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.6"/>
      <circle cx="32" cy="27" r="2" fill="#9fb2cc"/><circle cx="40" cy="27" r="2" fill="#9fb2cc"/>
      <text x="64" y="66" text-anchor="middle" font-size="14.5" font-weight="600">Client</text>
    </g>

    <!-- edge-a -->
    <g transform="translate(252,148)">
      <rect width="152" height="76" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <circle cx="32" cy="34" r="14" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
      <ellipse cx="32" cy="34" rx="6" ry="14" fill="none" stroke="#2dd4bf" stroke-width="1.3"/>
      <line x1="18" y1="34" x2="46" y2="34" stroke="#2dd4bf" stroke-width="1.3"/>
      <text x="58" y="30" font-size="13.5" font-weight="700">edge-a</text>
      <text x="58" y="49" font-size="11" fill="#7fe6d8">region A · :8443</text>
    </g>

    <!-- edge-b -->
    <g transform="translate(252,300)">
      <rect width="152" height="76" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <circle cx="32" cy="34" r="14" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
      <ellipse cx="32" cy="34" rx="6" ry="14" fill="none" stroke="#2dd4bf" stroke-width="1.3"/>
      <line x1="18" y1="34" x2="46" y2="34" stroke="#2dd4bf" stroke-width="1.3"/>
      <text x="58" y="30" font-size="13.5" font-weight="700">edge-b</text>
      <text x="58" y="49" font-size="11" fill="#7fe6d8">region B · :9443</text>
    </g>

    <!-- proxy (one per edge) -->
    <g transform="translate(548,196)">
      <rect width="158" height="80" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <path d="M26,30 l12,-7 l12,7 l0,14 l-12,7 l-12,-7 z" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
      <text x="58" y="34" font-size="13.5" font-weight="700">proxy ×2</text>
      <text x="58" y="53" font-size="11" fill="#7fe6d8">one per edge</text>
    </g>

    <!-- app -->
    <g transform="translate(694,336)">
      <rect width="150" height="70" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="50" y="14" width="50" height="34" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.5"/>
      <line x1="50" y1="23" x2="100" y2="23" stroke="#9fb2cc" stroke-width="1.5"/>
      <text x="75" y="60" text-anchor="middle" font-size="14" font-weight="600">demo app</text>
    </g>

    <!-- client -> edges (DNS/Anycast steering) -->
    <path d="M168,232 C210,232 214,192 250,188" fill="none" stroke="#2dd4bf" stroke-width="2.4" marker-end="url(#aTeal)"/>
    <path d="M168,260 C210,260 214,336 250,340" fill="none" stroke="#2dd4bf" stroke-width="2.4" marker-end="url(#aTeal)"/>
    <text x="196" y="284" text-anchor="middle" font-size="10.5" fill="#9fb2cc">DNS / Anycast</text>

    <!-- reverse tunnels: each proxy dials out to its edge -->
    <path d="M548,214 C470,214 486,190 406,186" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aAmber)"/>
    <path d="M548,258 C470,258 486,338 406,342" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#aAmber)"/>
    <text x="452" y="266" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="700">proxies dial out → :7844</text>

    <!-- proxy -> app -->
    <path d="M628,276 C628,320 660,320 694,344" fill="none" stroke="#2dd4bf" stroke-width="2.4" marker-end="url(#aTeal)"/>

    <text x="450" y="460" text-anchor="middle" font-size="13" fill="#9fb2cc">Stop one edge and traffic keeps flowing through the other — steer clients across regions with DNS / Anycast.</text>
  </g>
</svg>
