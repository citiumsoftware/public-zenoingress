<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Canary traffic splitting: one HTTPRoute weighted 90 to stable and 10 to canary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2140"/><stop offset="1" stop-color="#071426"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="-10%" r="95%"><stop offset="0" stop-color="#164a77" stop-opacity="0.55"/><stop offset="1" stop-color="#164a77" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12325a"/><stop offset="1" stop-color="#0e2647"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#124a4a"/><stop offset="1" stop-color="#0d3138"/></linearGradient>
    <linearGradient id="amberNode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a12"/><stop offset="1" stop-color="#31280d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#02060c" flood-opacity="0.55"/></filter>
    <filter id="tealGlow" x="-70%" y="-90%" width="240%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2dd4bf" flood-opacity="0.5"/></filter>
    <marker id="aTeal" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>

  <rect width="900" height="420" fill="url(#bg)"/>
  <rect width="900" height="420" fill="url(#halo)"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#e8eef7">
    <circle cx="52" cy="52" r="6" fill="#2dd4bf"/>
    <text x="70" y="50" font-size="23" font-weight="700">Canary traffic splitting</text>
    <text x="70" y="74" font-size="14" fill="#9fb2cc">One hostname, two versions — traffic split by weight in a single HTTPRoute.</text>

    <!-- Client -->
    <g transform="translate(48,182)">
      <rect width="130" height="72" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="22" y="18" width="86" height="30" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.6"/>
      <circle cx="32" cy="25" r="2" fill="#9fb2cc"/><circle cx="40" cy="25" r="2" fill="#9fb2cc"/>
      <text x="65" y="62" text-anchor="middle" font-size="14.5" font-weight="600">Client</text>
    </g>

    <!-- HTTPRoute (weighted) -->
    <g transform="translate(300,178)">
      <rect width="180" height="80" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <text x="90" y="34" text-anchor="middle" font-size="14.5" font-weight="700">HTTPRoute</text>
      <text x="90" y="55" text-anchor="middle" font-size="11.5" fill="#7fe6d8">canary.zenoingress.test</text>
    </g>

    <!-- arrow client -> route -->
    <line x1="180" y1="218" x2="298" y2="218" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#aTeal)"/>

    <!-- branch to v1 (thick = 90%) -->
    <path d="M480,205 C560,205 560,120 636,120" fill="none" stroke="#2dd4bf" stroke-width="7" marker-end="url(#aTeal)"/>
    <!-- branch to v2 (thin = 10%) -->
    <path d="M480,232 C560,232 560,315 636,315" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#aAmber)"/>

    <text x="556" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">90%</text>
    <text x="560" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b">10%</text>

    <!-- v1 stable -->
    <g transform="translate(644,86)">
      <rect width="180" height="68" rx="15" fill="url(#node)" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <circle cx="30" cy="34" r="8" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <text x="108" y="30" text-anchor="middle" font-size="14.5" font-weight="700">welcome-v1</text>
      <text x="108" y="49" text-anchor="middle" font-size="11.5" fill="#7fe6d8">stable</text>
    </g>

    <!-- v2 canary -->
    <g transform="translate(644,281)">
      <rect width="180" height="68" rx="15" fill="url(#amberNode)" stroke="#f59e0b" stroke-opacity="0.5"/>
      <circle cx="30" cy="34" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <text x="108" y="30" text-anchor="middle" font-size="14.5" font-weight="700">welcome-v2</text>
      <text x="108" y="49" text-anchor="middle" font-size="11.5" fill="#f0b45f">canary</text>
    </g>

    <!-- proportion bar -->
    <g transform="translate(300,372)">
      <rect x="0" y="0" width="270" height="14" rx="7" fill="#f59e0b"/>
      <rect x="0" y="0" width="243" height="14" rx="7" fill="#2dd4bf"/>
      <text x="300" y="12" font-size="12" fill="#9fb2cc">shift the weights to roll forward → 50/50 → 0/100</text>
    </g>
  </g>
</svg>
