<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Hybrid edge: the in-cluster proxy dials out to a public edge over a reverse tunnel; the sovereign cluster has no inbound ports">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2140"/><stop offset="1" stop-color="#071426"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="-10%" r="95%"><stop offset="0" stop-color="#164a77" stop-opacity="0.55"/><stop offset="1" stop-color="#164a77" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12325a"/><stop offset="1" stop-color="#0e2647"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#124a4a"/><stop offset="1" stop-color="#0d3138"/></linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#02060c" flood-opacity="0.55"/></filter>
    <filter id="tealGlow" x="-70%" y="-90%" width="240%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2dd4bf" flood-opacity="0.5"/></filter>
    <marker id="aTeal" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>

  <rect width="900" height="460" fill="url(#bg)"/>
  <rect width="900" height="460" fill="url(#halo)"/>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" fill="#e8eef7">
    <circle cx="52" cy="52" r="6" fill="#2dd4bf"/>
    <text x="70" y="50" font-size="23" font-weight="700">Hybrid edge — inside-out reverse tunnel</text>
    <text x="70" y="74" font-size="14" fill="#9fb2cc">The cluster's proxy dials OUT to a public edge; traffic rides back. Zero inbound ports on the cluster.</text>

    <!-- sovereign cluster boundary -->
    <rect x="466" y="116" width="406" height="316" rx="18" fill="#0a2038" fill-opacity="0.55" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="486" y="146" font-size="14" font-weight="700" fill="#e8eef7">Sovereign cluster</text>
    <text x="486" y="166" font-size="12" fill="#f0b45f">no inbound ports · egress-only</text>

    <!-- Client -->
    <g transform="translate(44,206)">
      <rect width="140" height="80" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="26" y="20" width="88" height="30" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.6"/>
      <circle cx="36" cy="27" r="2" fill="#9fb2cc"/><circle cx="44" cy="27" r="2" fill="#9fb2cc"/>
      <text x="70" y="66" text-anchor="middle" font-size="14.5" font-weight="600">Client</text>
    </g>

    <!-- Edge (public) -->
    <g transform="translate(236,206)">
      <rect width="158" height="80" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <circle cx="34" cy="34" r="15" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
      <ellipse cx="34" cy="34" rx="6.5" ry="15" fill="none" stroke="#2dd4bf" stroke-width="1.4"/>
      <line x1="19" y1="34" x2="49" y2="34" stroke="#2dd4bf" stroke-width="1.4"/>
      <text x="98" y="30" text-anchor="middle" font-size="13.5" font-weight="700">edge</text>
      <text x="98" y="48" text-anchor="middle" font-size="11" fill="#7fe6d8">public front door</text>
    </g>
    <text x="315" y="308" text-anchor="middle" font-size="11.5" fill="#9fb2cc">TLS terminates here</text>

    <!-- Proxy (inside cluster) -->
    <g transform="translate(520,178)">
      <rect width="156" height="80" rx="15" fill="url(#accent)" stroke="#2dd4bf" stroke-opacity="0.6" filter="url(#tealGlow)"/>
      <path d="M26,28 l12,-7 l12,7 l0,14 l-12,7 l-12,-7 z" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
      <text x="98" y="34" text-anchor="middle" font-size="13.5" font-weight="700">proxy</text>
      <text x="98" y="52" text-anchor="middle" font-size="11" fill="#7fe6d8">tunnel mode</text>
    </g>

    <!-- app (inside cluster) -->
    <g transform="translate(700,320)">
      <rect width="150" height="70" rx="15" fill="url(#node)" stroke="#26456b" filter="url(#shadow)"/>
      <rect x="50" y="14" width="50" height="34" rx="5" fill="none" stroke="#9fb2cc" stroke-width="1.5"/>
      <line x1="50" y1="23" x2="100" y2="23" stroke="#9fb2cc" stroke-width="1.5"/>
      <text x="75" y="60" text-anchor="middle" font-size="14" font-weight="600">demo app</text>
    </g>

    <!-- client -> edge -->
    <line x1="186" y1="246" x2="234" y2="246" stroke="#2dd4bf" stroke-width="2.6" marker-end="url(#aTeal)"/>
    <text x="210" y="236" text-anchor="middle" font-size="10.5" fill="#9fb2cc">HTTPS</text>

    <!-- reverse tunnel: dial-out (proxy -> edge) -->
    <path d="M520,206 C452,206 462,224 396,228" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#aAmber)"/>
    <!-- requests ride back (edge -> proxy) -->
    <path d="M396,258 C462,262 452,240 518,240" fill="none" stroke="#2dd4bf" stroke-width="2.6" marker-end="url(#aTeal)"/>
    <text x="456" y="196" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="700">proxy dials out → :7844</text>
    <text x="456" y="285" text-anchor="middle" font-size="11" fill="#2dd4bf" font-weight="600">requests ride back</text>

    <!-- proxy -> app -->
    <path d="M598,258 C598,300 660,300 700,332" fill="none" stroke="#2dd4bf" stroke-width="2.4" marker-end="url(#aTeal)"/>

    <text x="450" y="446" text-anchor="middle" font-size="13" fill="#9fb2cc">One egress connection carries the cluster's entire inbound workload — nothing to port-scan.</text>
  </g>
</svg>
